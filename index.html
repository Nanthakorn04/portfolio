<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <title>Portfolio 3D Interactive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #060616 0%, #0f1630 100%);
    }

    canvas {
      display: block;
    }

    /* Dialogue box - modern, glow, hover, readable */
    #dialogueBox {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 820px;
      background: linear-gradient(140deg, rgba(8, 10, 30, 0.96), rgba(22, 26, 55, 0.94));
      color: #e6f7ff;
      font-size: 1.18em;
      font-weight: 600;
      padding: 18px 26px;
      border-radius: 20px;
      border: 1px solid rgba(0, 204, 255, 0.18);
      box-shadow:
        0 6px 30px rgba(0, 0, 0, 0.6),
        0 0 24px rgba(0, 204, 255, 0.06) inset;
      white-space: pre-wrap;
      display: none;
      cursor: pointer;
      backdrop-filter: blur(6px) saturate(120%);
      transition: transform 0.18s cubic-bezier(.2, .9, .2, 1), box-shadow 0.18s;
      text-align: left;
      line-height: 1.45;
    }

    #dialogueBox .hint {
      display: block;
      margin-top: 12px;
      font-size: 0.9em;
      color: rgba(230, 247, 255, 0.9);
      opacity: 0.9;
      text-align: right;
      font-weight: 500;
    }

    #dialogueBox:hover {
      transform: translateX(-50%) scale(1.02);
      box-shadow:
        0 10px 44px rgba(0, 0, 0, 0.65),
        0 0 48px rgba(0, 204, 255, 0.12) inset;
    }

    /* small notice for mobile:*/
    @media (max-width:600px) {
      #dialogueBox {
        font-size: 1.05em;
        padding: 16px;
        width: 92%;
      }
    }

    /* Floating subtle label in top-left explaining controls */
    #uiHint {
      position: absolute;
      top: 14px;
      left: 18px;
      color: #bfefff;
      font-size: 0.95em;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(5, 8, 20, 0.35);
      border: 1px solid rgba(0, 204, 255, 0.06);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #ffffff 0%, #f8f5f0 50%, #eae6e0 100%);
      color: #333;
      margin: 0;
      overflow: hidden;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>

<body>
  <div id="uiHint">Left-click objects • Drag to orbit • Click dialogue to continue</div>
  <div id="dialogueBox" aria-live="polite"></div>

  <script>
    (function () {
      // Scene / Camera / Renderer
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
      camera.position.set(0, 5, 35);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.5, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.12;
      controls.minDistance = 6;
      controls.maxDistance = 80;

      // Environment (EXR) -> gives nice reflections for materials
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const exrLoader = new THREE.EXRLoader();
      exrLoader.load('https://nanthakorn04.github.io/portfolio/Space_Nebula_2K (1).exr', tex => {
        const envMap = pmremGen.fromEquirectangular(tex).texture;
        scene.environment = envMap;
        scene.background = envMap;
        tex.dispose();
        pmremGen.dispose();
      });

      // common lists
      const clickable = []; // all clickable mesh objects (text meshes)
      let projectButtons = []; // store project meshes for easy removal
      const gltfLoader = new THREE.GLTFLoader();
      let modelA, modelB, modelC, newModel;
      let mixers = [];

      // Load sample models (original urls preserved)
      function loadModelA() {
        gltfLoader.load('https://nanthakorn04.github.io/portfolio/sen.glb', g => {
          if (modelA) scene.remove(modelA);
          modelA = g.scene;
          modelA.position.set(0, 0, -2);
          scene.add(modelA);
        }, undefined, e => { /* ignore errors */ });
      }
      function loadModelB() {
        gltfLoader.load('https://nanthakorn04.github.io/portfolio/venom.glb', g => {
          if (modelB) scene.remove(modelB);
          modelB = g.scene;
          modelB.position.set(0, 0, -2);
          scene.add(modelB);
        }, undefined, e => { /* ignore errors */ });
      }
      function loadModelC() {
        gltfLoader.load('https://nanthakorn04.github.io/portfolio/sp.glb', g => {
          if (modelC) scene.remove(modelC);
          modelC = g.scene;
          modelC.position.set(0, 0, -2);
          scene.add(modelC);
          if (g.animations && g.animations.length > 0) {
            const mixer = new THREE.AnimationMixer(modelC);
            g.animations.forEach(clip => mixer.clipAction(clip).play());
            mixers.push(mixer);
          }
        }, undefined, e => { /* ignore errors */ });
      }

      loadModelA(); loadModelB(); loadModelC();

      // Fonts & UI text meshes
      let fontLoaderInstance = null;
      const fontLoader = new THREE.FontLoader();
      fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', font => {
        fontLoaderInstance = font;
        createHeaderButtons();
      });

      // Create stylized 3D text buttons (About, Works, Back)
      function makeTextMesh(text, opts = {}) {
        const geo = new THREE.TextGeometry(text, {
          font: fontLoaderInstance,
          size: opts.size ?? 0.6,
          height: opts.height ?? 0.09,
          bevelEnabled: true,
          bevelThickness: 0.02,
          bevelSize: 0.02,
          curveSegments: 8
        });
        geo.computeBoundingBox();
        geo.center(); // center geometry so mesh.position refers to center
        const mat = new THREE.MeshStandardMaterial({
          color: opts.color ?? 0xffffff,
          metalness: opts.metalness ?? 0.7,
          roughness: opts.roughness ?? 0.18,
          emissive: opts.emissive ?? 0x000000,
          emissiveIntensity: opts.emissiveIntensity ?? 0.0
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData._baseScale = opts.baseScale ?? 1;
        mesh.scale.set(mesh.userData._baseScale, mesh.userData._baseScale, mesh.userData._baseScale);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      let aboutBtn, worksBtn, backBtn;
      function createHeaderButtons() {
        // About
        aboutBtn = makeTextMesh('About', { color: 0xffffff, emissive: 0x00e6ff, emissiveIntensity: 0.12, size: 0.7, baseScale: 1 });
        aboutBtn.position.set(-8, 2.4, -4);
        aboutBtn.name = 'NextText';
        scene.add(aboutBtn);
        clickable.push(aboutBtn);

        // Works
        worksBtn = makeTextMesh('Works', { color: 0x00ccff, emissive: 0x00aaff, emissiveIntensity: 0.12, size: 0.7, baseScale: 1 });
        worksBtn.position.set(-8, 1.2, -4);
        worksBtn.name = 'WorkText';
        scene.add(worksBtn);
        clickable.push(worksBtn);

        // Back
        backBtn = makeTextMesh('BACK', { color: 0xff6666, emissive: 0xff4444, emissiveIntensity: 0.14, size: 0.6, baseScale: 1 });
        backBtn.position.set(-8, 0.1, -4);
        backBtn.name = 'BackText';
        backBtn.visible = false;
        scene.add(backBtn);
        clickable.push(backBtn);
      }
      // 🔥 แสงอาทิตย์ด้านหน้า (แดงส้มอบอุ่น)



      scene.add(new THREE.AmbientLight(0xfff9f0, 0.9)); // แสงทั่วฉากอ่อนๆ

      const sunLight = new THREE.DirectionalLight(0xfff0d5, 2.2); // แสงหลักจากด้านบนขวา
      sunLight.position.set(12, 10, 8);
      sunLight.castShadow = true;
      scene.add(sunLight);

      const backLight = new THREE.DirectionalLight(0xf8faff, 0.9); // แสงเย็นจากด้านหลัง
      backLight.position.set(-10, 6, -6);
      scene.add(backLight);

      const skyLight = new THREE.HemisphereLight(0xfffaf0, 0xddddff, 1.0); // แสงจากท้องฟ้า
      scene.add(skyLight);

      // 🔥 แสงแดงส้มจากด้านหน้า (เพิ่มความอบอุ่น)
      const frontLight = new THREE.DirectionalLight(0xffa366, 1.5);
      frontLight.position.set(0, 4, 10);
      frontLight.castShadow = true;
      scene.add(frontLight);

      renderer.setClearColor(new THREE.Color(0xfaf7f2), 1);
      scene.background = new THREE.Color(0xfaf7f2);


      const purpleLight = new THREE.DirectionalLight(0xcc99ff, 2.8);
      purpleLight.position.set(-1, 0, 6); // อยู่หน้าโมเดลเล็กน้อย
      purpleLight.castShadow = false;
      scene.add(purpleLight);

      const purpleFill = new THREE.PointLight(0xcc99ff, 1.2, 30);
      purpleFill.position.set(0, 4, 6);
      scene.add(purpleFill);



      // Camera views used when moving camera
      const VIEWS = {
        NextText: { pos: new THREE.Vector3(2.5, 1.5, 6), tar: new THREE.Vector3(2, 0.5, -2) },
        WorkText: { pos: new THREE.Vector3(-3, 1.5, 6), tar: new THREE.Vector3(0, 0.5, -2) },
        BackText: { pos: new THREE.Vector3(0, 2.5, 12), tar: new THREE.Vector3(0, 0.5, 0) }
      };

      // Raycasting + pointer
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let lastHovered = null;

      function setPointer(e) {
        const r = renderer.domElement.getBoundingClientRect();
        const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
        const x = clientX - r.left;
        const y = clientY - r.top;
        pointer.x = (x / r.width) * 2 - 1;
        pointer.y = -(y / r.height) * 2 + 1;
      }

      // camera movement smoothing
      let isMoving = false;
      const camTargetPos = new THREE.Vector3();
      const camTargetLook = new THREE.Vector3();

      // Dialogue typing system (click to continue)
      const dialogueBox = document.getElementById('dialogueBox');
      let textQueue = [];
      let currentTextIndex = 0;
      let isTyping = false;
      let typingInterval = null;

      function typeText(texts) {
        // texts: array of strings to show one-by-one
        textQueue = texts || [];
        currentTextIndex = 0;
        dialogueBox.style.display = 'block';
        showNextText();
      }

      function showNextText() {
        if (currentTextIndex >= textQueue.length) {
          // no more text -> keep box visible (user can click Back) or hide optionally
          // We'll keep box visible so user can read; they can click BACK
          return;
        }
        const box = dialogueBox;
        box.textContent = '';
        isTyping = true;

        const raw = textQueue[currentTextIndex];
        let i = 0;
        if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
        typingInterval = setInterval(() => {
          // remove hint if present while typing
          if (box.querySelector('.hint')) {
            // not using inner element here; simply remove trailing hint text if exists
            // we won't rely on inner elements to avoid rebuilding DOM often
            const content = box.textContent.replace(/\n\nClick to continue\.\.\.$/, '');
            box.textContent = content;
          }
          box.textContent += raw[i] ?? '';
          i++;
          if (i >= raw.length) {
            clearInterval(typingInterval);
            typingInterval = null;
            isTyping = false;
            // append hint line (English)
            box.textContent += "\n\nClick to continue...";
          }
        }, 28);
        currentTextIndex++;
      }

      dialogueBox.addEventListener('click', () => {
        if (!isTyping) {
          showNextText();
        } else {
          // if typing and user clicks, fast-forward to complete current line
          if (typingInterval) {
            clearInterval(typingInterval);
            typingInterval = null;
          }
          const box = dialogueBox;
          const raw = textQueue[currentTextIndex - 1] || '';
          box.textContent = raw + "\n\nClick to continue...";
          isTyping = false;
        }
      });

      function clearText() {
        dialogueBox.style.display = 'none';
        dialogueBox.textContent = '';
        textQueue = [];
        currentTextIndex = 0;
        isTyping = false;
        if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
      }

      // Create project buttons when Works clicked
      function showProjects() {
        clearText();
        // remove previous project buttons from scene & clickable
        projectButtons.forEach(btn => {
          const idx = clickable.indexOf(btn);
          if (idx >= 0) clickable.splice(idx, 1);
          scene.remove(btn);
        });
        projectButtons = [];

        const projectNames = ["Project 1", "Project 2", "Project 3", "Project 4"];
        const positions = [
          new THREE.Vector3(-4.5, 1.2, -1.5), // ซ้ายสุด
          new THREE.Vector3(-1.5, 1.2, -1.5), // ซ้ายกลาง
          new THREE.Vector3(1.5, 1.2, -1.5),  // ขวากลาง
          new THREE.Vector3(4.5, 1.2, -1.5)   // ขวาสุด
        ];


        projectNames.forEach((name, i) => {
          const mesh = makeTextMesh(name, { color: 0x9ef0ff, emissive: 0x00f0ff, emissiveIntensity: 0.18, size: 0.52, baseScale: 1 });
          mesh.position.copy(positions[i]);
          mesh.name = "Project" + (i + 1);
          scene.add(mesh);
          clickable.push(mesh);
          projectButtons.push(mesh);
        });
      }

      // Pointer move -> highlight hoverable meshes
      function onPointerMove(e) {
        setPointer(e);
        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(clickable, true);
        const hit = intersects.length ? intersects[0].object : null;

        if (lastHovered && lastHovered !== hit) {
          // restore previous
          lastHovered.scale.set(lastHovered.userData._baseScale, lastHovered.userData._baseScale, lastHovered.userData._baseScale);
          if (lastHovered.material && lastHovered.material.emissive) lastHovered.material.emissiveIntensity = lastHovered.userData._emissiveBase ?? 0.12;
          lastHovered = null;
          document.body.style.cursor = '';
        }

        if (hit && hit !== lastHovered) {
          lastHovered = hit;
          lastHovered.userData._emissiveBase = lastHovered.material && lastHovered.material.emissiveIntensity ? lastHovered.material.emissiveIntensity : 0;
          lastHovered.scale.set(lastHovered.userData._baseScale * 1.08, lastHovered.userData._baseScale * 1.08, lastHovered.userData._baseScale * 1.08);
          if (lastHovered.material && lastHovered.material.emissive) lastHovered.material.emissiveIntensity = (lastHovered.userData._emissiveBase || 0.0) + 0.25;
          document.body.style.cursor = 'pointer';
        }
      }

      // click on scene objects
      function onPick(e) {
        // ignore clicks when clicking on dialogue box (dialogue box has its own handler)
        if (e.target === dialogueBox || dialogueBox.contains(e.target)) return;

        setPointer(e);
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(clickable, true)[0];
        if (!hit) return;
        const name = hit.object.name;

        if (name === 'NextText') { // About
          // remove environment models for clarity
          if (modelA) scene.remove(modelA);
          if (modelB) scene.remove(modelB);
          if (modelC) scene.remove(modelC);
          if (newModel) scene.remove(newModel);

          // load profile model (if any)
          gltfLoader.load('https://nanthakorn04.github.io/portfolio/profile1.glb', g => {
            if (newModel) scene.remove(newModel);
            newModel = g.scene;
            newModel.position.set(6, 0, -15);
            scene.add(newModel);
          }, undefined, () => { /* ignore */ });

          // texts - array lines to be clicked through
          typeText([
            "Hello, my name is Nanthakorn Ruaengpueng. Email: nanthakorn.r@ku.th   Mobile: 093-932-1419",
            "I am a graduate of Kasetsart University, majoring in Computer Science.",
            "Passionate about software development and innovative technology."
          ]);

          // hide clicked About button, show Back
          hit.object.visible = false;
          const backMesh = scene.getObjectByName('BackText');
          if (backMesh) backMesh.visible = true;

          // move camera to About view
          camTargetPos.copy(VIEWS.NextText.pos);
          camTargetLook.copy(VIEWS.NextText.tar);
          controls.target.copy(camTargetLook);
          isMoving = true;
        }

        if (name === 'WorkText') { // Works
          if (modelA) scene.remove(modelA);
          if (modelB) scene.remove(modelB);
          if (modelC) scene.remove(modelC);
          if (newModel) scene.remove(newModel);

          // hide About button when entering Works
          const aboutBtn = scene.getObjectByName('NextText');
          if (aboutBtn) aboutBtn.visible = false;

          // clear previous project buttons and create new ones
          projectButtons.forEach(b => {
            const idx = clickable.indexOf(b);
            if (idx >= 0) clickable.splice(idx, 1);
            scene.remove(b);
          });
          projectButtons = [];
          showProjects();

          // hide clicked Works button, show Back
          hit.object.visible = false;
          const backMesh = scene.getObjectByName('BackText');
          if (backMesh) backMesh.visible = true;

          // camera view to works
          camTargetPos.copy(VIEWS.WorkText.pos);
          camTargetLook.copy(VIEWS.WorkText.tar);
          controls.target.copy(camTargetLook);
          isMoving = true;
        }

        if (name.startsWith("Project")) {
          const projectIndex = parseInt(name.replace("Project", ""), 10);
          const details = [
            [
              "Project 1: Aerial Object Detection with Image Processing",
              "• Implemented object detection models to identify aerial objects in images.",
              "• Tools: MATLAB, Python (OpenCV), dataset labeling & evaluation."
            ],
            [
              "Project 2: Data Base system",
              "• Designed and developed a relational database using MySQL to support core system functions.",
              "• Created SQL queries and managed data integrity and backups."
            ],
            [
              "Project 3: Web Fiction Platform",
              "• Developed a responsive web application for reading fiction with user accounts.",
              "• Tech: HTML/CSS (Bootstrap), JS, Node.js, MySQL."
            ],
            [
              "Project 4: Assignment Management System",
              "• Developed a web-based assignment submission and management system.",
              "• Tech: HTML/CSS, JavaScript, PHP, XAMPP."
            ]
          ];
          // show multi-line detail for selected project
          typeText(details[projectIndex - 1] || ["No details available."]);
        }

        if (name === 'BackText') { // Back (return to main)
          if (newModel) scene.remove(newModel);
          loadModelA(); loadModelB(); loadModelC();
          clearText();

          // remove project buttons
          projectButtons.forEach(b => {
            const idx = clickable.indexOf(b);
            if (idx >= 0) clickable.splice(idx, 1);
            scene.remove(b);
          });
          projectButtons = [];

          // restore About and Works visibility
          const aboutBtn = scene.getObjectByName('NextText');
          if (aboutBtn) aboutBtn.visible = true;
          const workBtn = scene.getObjectByName('WorkText');
          if (workBtn) workBtn.visible = true;

          const backMesh = scene.getObjectByName('BackText');
          if (backMesh) backMesh.visible = false;

          camTargetPos.copy(VIEWS.BackText.pos);
          camTargetLook.copy(VIEWS.BackText.tar);
          controls.target.copy(camTargetLook);
          isMoving = true;
        }
      }

      // events
      renderer.domElement.addEventListener('pointermove', onPointerMove, { passive: true });
      renderer.domElement.addEventListener('click', onPick, { passive: true });
      renderer.domElement.addEventListener('touchend', onPick, { passive: true });

      // resize
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // animation loop
      const clock = new THREE.Clock();
      function loop() {
        const delta = clock.getDelta();
        mixers.forEach(m => m.update(delta));

        // smooth camera movement when requested
        if (isMoving) {
          camera.position.lerp(camTargetPos, 0.04);
          controls.target.lerp(camTargetLook, 0.04);
          if (camera.position.distanceTo(camTargetPos) < 0.03 && controls.target.distanceTo(camTargetLook) < 0.03) {
            isMoving = false;
          }
        }

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();

      // small accessibility: hide pointer cursor when over dialogue
      dialogueBox.addEventListener('pointerenter', () => document.body.style.cursor = 'pointer');
      dialogueBox.addEventListener('pointerleave', () => document.body.style.cursor = '');

      // expose a tiny helper to quickly change About text externally if needed
      window.__setAboutText = function (arr) { if (Array.isArray(arr)) typeText(arr); };

    })();
  </script>
</body>

</html>
